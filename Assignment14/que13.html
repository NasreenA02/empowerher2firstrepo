<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive DOM Manipulation</title>
</head>
<body>

  <h1>Interactive DOM Manipulation</h1>

 
  <input type="text" id="colorInput" placeholder="Enter a color">
  <button id="bgBtn">Change Background</button>
  <br><br>

  <input type="text" id="textInput" placeholder="Enter new text">
  <button id="textBtn">Update Text</button>
  <br><br>

  <div id="box" style="width: 300px; padding: 20px; background: lightgray;">
    Initial content in the box.
  </div>

  <script>
   
    const colorInput = document.getElementById("colorInput");
    const textInput = document.getElementById("textInput");
    const bgBtn = document.getElementById("bgBtn");
    const textBtn = document.getElementById("textBtn");
    const box = document.getElementById("box");

    
    function isValidColor(color) {
      const s = new Option().style;
      s.color = color;
      return s.color !== "";
    }

   
    bgBtn.addEventListener("click", () => {
      const colorValue = colorInput.value.trim();

      if (isValidColor(colorValue)) {
        box.style.background = colorValue;
      } else {
        alert("Invalid color name!");
      }
    });
    textBtn.addEventListener("click", () => {
      const textValue = textInput.value.trim();

      if (textValue === "") {
        alert("Please enter some text!");
      } else {
        box.textContent = textValue;
      }
    });
  </script>

</body>
</html>
