<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founders Showcase</title>

<style>
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
        margin: 25px 0;
        font-size: 30px;
    }

    .grid-container {
        width: 90%;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
    }

    
    .card {
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

   
    .card .founder-img {
        width: 100%;
        height: 170px;
        border-radius: 10px;
        object-fit: cover;
        margin-bottom: 10px;
    }

    .card > h3 {
        margin-bottom: 5px;
        font-size: 18px;
    }

    
    .card p {
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
    }


    h3 + p {
        font-style: italic;
    }

    
    .logo {
        width: 60px;
        height: auto;
        margin-top: 5px;
    }

    .card:hover {
        transform: scale(1.05);
        transition: 0.3s;
    }
</style>
</head>
<body>

<h1>Founders Showcase</h1>

<div class="grid-container">

   
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg" alt="Founder">
        <h3>Vijay Shekhar Sharma</h3>
        <p>Founder & CEO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/paytm_rect_06df45a24f.svg" alt="Paytm Logo">
    </div>

   
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/Rectangle_427_637d69bb57.png" alt="Founder">
        <h3>Kunal Shah</h3>
        <p>Founder</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/cred_0a47d7b4f8.png" alt="CRED Logo">
    </div>

    
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/amrish_rau_pine_labs_144e5e587c.jpg" alt="Founder">
        <h3>Amrish Rau</h3>
        <p>CEO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/pine_labs_0aa2407434.png" alt="Pine Labs Logo">
    </div>

   
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/Sampad_swain_Instamojo_f12bf6341e.jpg" alt="Founder">
        <h3>Sampad Swain</h3>
        <p>Co-Founder & CEO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/instamojo_8763e704f7.png" alt="Instamojo Logo">
    </div>

    
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/Ankush_Sachdeva_Sharechat_4e44dbbe6b.jpg" alt="Founder">
        <h3>Ankush Sachdeva</h3>
        <p>Co-Founder & CEO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="ShareChat">
    </div>

   
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/bhanu_pratap_singh_sharechat_11fdd7b47a.jpg" alt="Founder">
        <h3>Bhanu Pratap Singh</h3>
        <p>Co-Founder & CTO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="ShareChat">
    </div>

  
    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/farid_ahsan_sharechat_1251f28141.png" alt="Founder">
        <h3>Farid Ahsan</h3>
        <p>Co-Founder & COO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="ShareChat">
    </div>

    <div class="card">
        <img class="founder-img" src="https://cdn.masaischool.com/masai-website/Amit_Kumar_Agarwal_Nobroker_a8a279ad91.jpg" alt="Founder">
        <h3>Amit Kumar Agarwal</h3>
        <p>Founder & CEO</p>
        <img class="logo" src="https://cdn.masaischool.com/masai-website/nobroker_rect_28c9778c30.svg" alt="NoBroker Logo">
    </div>

</div>

</body>
</html>
