<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Notes</title>
</head>
<body>

  <h2>User Notes</h2>

  <textarea id="notesArea" rows="8" cols="40" placeholder="Write your notes here..."></textarea>
  <br><br>

  <button id="saveBtn">Save Notes</button>
  <button id="loadBtn">Load Notes</button>
  <button id="clearBtn">Clear Notes</button>

  <script>
    const notesArea = document.getElementById("notesArea");

    // Load saved notes on page load
    window.addEventListener("load", () => {
      const savedNotes = localStorage.getItem("userNotes");
      if (savedNotes) {
        notesArea.value = savedNotes;
        console.log("Notes loaded on page load.");
      }
    });

    // Save notes
    document.getElementById("saveBtn").addEventListener("click", () => {
      const notes = notesArea.value.trim();
      if (!notes) {
        alert("Cannot save empty notes!");
        return;
      }
      localStorage.setItem("userNotes", notes);
      alert("Notes saved!");
      console.log("Notes saved:", notes);
    });

    // Load notes
    document.getElementById("loadBtn").addEventListener("click", () => {
      const savedNotes = localStorage.getItem("userNotes");
      if (savedNotes) {
        notesArea.value = savedNotes;
        alert("Notes loaded!");
        console.log("Notes loaded:", savedNotes);
      } else {
        alert("No saved notes found!");
        console.log("No saved notes to load.");
      }
    });

    // Clear notes
    document.getElementById("clearBtn").addEventListener("click", () => {
      localStorage.removeItem("userNotes");
      notesArea.value = "";
      alert("Notes cleared!");
      console.log("Notes cleared.");
    });
  </script>

</body>
</html>
