<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paragraph button</title>
</head>
<body>

  <button id="addBtn">Add Paragraph</button>
  <button id="removeBtn">Remove Last Paragraph</button>

  <!-- Container that will hold the paragraphs-->
  <div id="container"></div>

  <script>
    // taking the container div where paragraphs will be added
    const container = document.getElementById("container");

    // Add Paragraph button logic
    document.getElementById("addBtn").addEventListener("click", function () {
      // Create a new paragraph element
      const p = document.createElement("p");

      // Set text content
      p.textContent = "This is a new paragraph.";

      // Append it to the container div
      container.appendChild(p);
    });

    // Remove Last Paragraph button logic
    document.getElementById("removeBtn").addEventListener("click", function () {
      // Check if the container has at least one child paragraph
      if (container.lastChild) {
        // Remove the last paragraph inside the container
        container.removeChild(container.lastChild);
      }
    });
  </script>

</body>
</html>
